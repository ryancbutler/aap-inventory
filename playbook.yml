---
# Simple playbook showing where each value comes from.
#
# Extra vars (passed from the AAP job template / survey / launch prompt):
#   target_group  which inventory group to run against (default: all)
#   greeting      a message to print                  (default: Hello)
#   target_env    copied into $DEMO_TARGET_ENV for tasks via `environment:`
#
# Inventory vars (set by the dynamic inventory script):
#   environment_name   group var on "all"
#   role               per-host var
#   api_token_present  true if the inventory sync had $INV_API_TOKEN
#
# Environment variables (injected by the "Demo Inventory Env" credential
# attached to the job template):
#   INV_ENVIRONMENT, INV_WEB_COUNT, INV_API_TOKEN

- name: Demo - extra vars, inventory vars, and environment variables
  hosts: "{{ target_group | default('all') }}"
  gather_facts: false

  # Option 2: turn an extra var (e.g. a survey answer) into an env var.
  # Applies to every task in this play.
  environment:
    DEMO_TARGET_ENV: "{{ target_env | default('dev') }}"

  tasks:
    - name: Show values from the job (extra vars) and from the inventory
      ansible.builtin.debug:
        msg:
          - "greeting (extra var):          {{ greeting | default('Hello') }}"
          - "target_group (extra var):      {{ target_group | default('all') }}"
          - "inventory_hostname:            {{ inventory_hostname }}"
          - "role (inventory host var):     {{ role }}"
          - "environment_name (group var):  {{ environment_name }}"
          - "api_token_present (group var): {{ api_token_present | default(false) }}"

    # Option 1: env vars injected by a credential on the job template.
    # lookup('env') reads the ansible-playbook process environment in the EE.
    - name: Show env vars injected by the job template credential
      ansible.builtin.debug:
        msg:
          - "INV_ENVIRONMENT: {{ lookup('env', 'INV_ENVIRONMENT') | default('(not set)', true) }}"
          - "INV_WEB_COUNT:   {{ lookup('env', 'INV_WEB_COUNT') | default('(not set)', true) }}"
          - "INV_API_TOKEN set: {{ lookup('env', 'INV_API_TOKEN') | length > 0 }}"
      run_once: true

    # The `environment:` block above only affects tasks, so a command sees it.
    - name: Show env var set from an extra var with the environment keyword
      ansible.builtin.command: printenv DEMO_TARGET_ENV
      register: demo_env
      changed_when: false
      run_once: true

    - name: Print it
      ansible.builtin.debug:
        msg: "DEMO_TARGET_ENV inside the task: {{ demo_env.stdout }}"
      run_once: true

    - name: Only runs on web hosts
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a web server in {{ environment_name }}"
      when: role == 'web'
