# Paste into: Administration -> Credential Types -> Add -> "Input configuration"
# Suggested name: Demo Inventory Env
fields:
  - id: env_name
    type: string
    label: Environment name
    help_text: Exposed to the job as $INV_ENVIRONMENT (e.g. dev, prod)
  - id: web_count
    type: string
    label: Number of web hosts
    help_text: Exposed to the job as $INV_WEB_COUNT
  - id: api_token
    type: string
    label: API token
    secret: true
    help_text: Exposed to the job as $INV_API_TOKEN (never printed)
required:
  - env_name
