# Paste into: Administration -> Credential Types -> Add -> "Injector configuration"
# Each key under env becomes an environment variable inside the execution
# environment for any job (or inventory sync) the credential is attached to.
env:
  INV_ENVIRONMENT: "{{ env_name }}"
  INV_WEB_COUNT: "{{ web_count | default('2', true) }}"
  INV_API_TOKEN: "{{ api_token | default('', true) }}"
